name: Data Quality - Soda Checks

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "soda/**"
      - "dbt_project/**"
      - ".github/workflows/soda_data_quality.yml"

jobs:
  soda-checks:
    name: Run Soda data quality checks
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Soda and dbt
        run: |
          python -m pip install --upgrade pip
          pip install "soda-core-snowflake~=3.5.0"
          

      - name: Validate required Snowflake secrets
        run: |
          test -n "$SNOWFLAKE_ACCOUNT" || (echo "SNOWFLAKE_ACCOUNT is missing" && exit 1)
          test -n "$SNOWFLAKE_USER" || (echo "SNOWFLAKE_USER is missing" && exit 1)
          test -n "$SNOWFLAKE_PASSWORD" || (echo "SNOWFLAKE_PASSWORD is missing" && exit 1)
          test -n "$SNOWFLAKE_ROLE" || (echo "SNOWFLAKE_ROLE is missing" && exit 1)
          test -n "$SNOWFLAKE_WAREHOUSE" || (echo "SNOWFLAKE_WAREHOUSE is missing" && exit 1)
          test -n "$SNOWFLAKE_DATABASE" || (echo "SNOWFLAKE_DATABASE is missing" && exit 1)
      
      - name: Run Soda checks on RAW layer
        run: |
          soda scan \
            -d synthetic_sales_raw \
            -c soda/configuration.yml \
            soda/checks_raw.yml

      - name: Run Soda checks on MARTS layer
        run: |
          soda scan \
            -d synthetic_sales_marts \
            -c soda/configuration.yml \
            soda/checks_marts.yml