name: CI - Python and dbt validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - develop

jobs:
  validate:
    name: Validate Python and dbt project
    runs-on: ubuntu-latest

    env:
      DBT_PROFILES_DIR: dbt_project
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show Python and dbt versions
        run: |
          python --version
          dbt --version

      - name: Validate Python imports
        run: |
          python -m compileall pipeline dags

      - name: Validate dbt connection
        working-directory: dbt_project
        run: |
          dbt debug --target ci --no-partial-parse

      - name: Parse dbt project
        working-directory: dbt_project
        run: |
          dbt parse --target ci --no-partial-parse

      - name: Compile dbt project
        working-directory: dbt_project
        run: |
          dbt compile --target ci --no-partial-parse

      - name: dbt build dry run
        working-directory: dbt_project
        run: |
          dbt build --target ci --selector transform_pipeline --empty --no-partial-parse