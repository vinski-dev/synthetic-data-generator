checks for SALES_RAW:
  - row_count > 0
  - missing_count(ORDER_ID) = 0
  - missing_count(CUSTOMER_ID) = 0
  - missing_count(ORDER_TIMESTAMP) = 0
  - missing_count(SOURCE_FILE_NAME) = 0
  - missing_count(LOAD_TS) = 0
  - duplicate_count(ORDER_ID) >= 0
  - failed rows:
      name: negative quantity should not exist
      fail query: |
        SELECT *
        FROM SALES_RAW
        WHERE QUANTITY <= 0

  - failed rows:
      name: negative net amount should not exist
      fail query: |
        SELECT *
        FROM SALES_RAW
        WHERE NET_AMOUNT < 0

  - failed rows:
      name: invalid order status should not exist
      fail query: |
        SELECT *
        FROM SALES_RAW
        WHERE UPPER(ORDER_STATUS) NOT IN ('COMPLETED', 'PENDING', 'CANCELLED', 'REFUNDED')