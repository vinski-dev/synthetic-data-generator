version: 2

sources:
  - name: raw
    database: SYNTHETIC_DATA
    schema: RAW

    config:
      loaded_at_field: LOAD_TS
      freshness:
        warn_after:
          count: 26
          period: hour
        error_after:
          count: 30
          period: hour

    tables:
      - name: sales_raw
        identifier: SALES_RAW
        description: Raw sales records loaded from S3 by Snowpipe.
        columns:
          - name: ORDER_ID
            data_tests:
              - not_null

          - name: CUSTOMER_ID
            data_tests:
              - not_null

          - name: SOURCE_FILE_NAME
            data_tests:
              - not_null

          - name: LOAD_TS
            data_tests:
              - not_null

models:
  - name: stg_sales
    description: Cleaned and standardized sales records from RAW.SALES_RAW.
    columns:
      - name: sales_event_key
        description: Stable transaction event key built from order_id, batch_id, and source_file_name.
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: Source order identifier from the generated sales file.
        data_tests:
          - not_null

      - name: customer_id
        description: Customer identifier from the sales transaction.
        data_tests:
          - not_null

      - name: order_status
        description: Standardized order status.
        data_tests:
          - accepted_values:
              #arguments:
               values: ["COMPLETED", "PENDING", "CANCELLED", "REFUNDED"]

      - name: source_file_name
        description: S3 file name loaded by Snowpipe.
        data_tests:
          - not_null

      - name: load_ts
        description: Snowflake load timestamp from Snowpipe.
        data_tests:
          - not_null